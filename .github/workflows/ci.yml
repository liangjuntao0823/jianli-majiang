name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 规则引擎单测
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path Packages/JianliCore

  ipa:
    name: 编译并打包 ipa（不签名）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 版本信息
        run: xcodebuild -version

      - name: 编译 App
        run: |
          set -o pipefail
          xcodebuild \
            -project JianliMahjong.xcodeproj \
            -scheme JianliMahjong \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -120

      - name: 打成 ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/JianliMahjong.app"
          ls -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JianliMahjong-unsigned.ipa Payload
          ls -lh JianliMahjong-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: JianliMahjong-unsigned-ipa
          path: JianliMahjong-unsigned.ipa
          if-no-files-found: error
